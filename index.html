<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>음악극 수업 자료</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Noto Serif KR',serif;
  background: linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 20px;
}
.wrap{
  width:100%;
  max-width:760px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:22px;
}
.main-title{
  color:#f0e6d3;
  font-family:'Nanum Myeongjo',serif;
  font-size:34pt;
  font-weight:800;
  letter-spacing:8px;
  text-align:center;
  text-shadow:0 2px 12px rgba(0,0,0,0.5);
}
.sub-title{
  color:#c9a96e;
  font-size:12.5pt;
  letter-spacing:2px;
  text-align:center;
  margin-top:-14px;
  margin-bottom:6px;
}

.section-label{
  width:100%;
  color:#c9a96e;
  font-family:'Nanum Myeongjo',serif;
  font-size:13pt;
  font-weight:700;
  letter-spacing:3px;
  border-bottom:1px solid rgba(201,169,110,0.35);
  padding-bottom:6px;
  margin-top:6px;
}

/* PPT 버튼 3개 */
.ppt-row{
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:14px;
}
.btn-ppt{
  background: linear-gradient(135deg,#c9a96e,#e8c97e,#c9a96e);
  border:none;
  border-radius:16px;
  padding:26px 12px;
  cursor:pointer;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  box-shadow:0 8px 32px rgba(201,169,110,0.35);
  transition:transform 0.2s, box-shadow 0.2s;
}
.btn-ppt:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 40px rgba(201,169,110,0.55);
}
.btn-ppt .icon{font-size:32pt;}
.btn-ppt .label{
  font-family:'Nanum Myeongjo',serif;
  font-size:14pt;
  font-weight:800;
  color:#1a1a2e;
  letter-spacing:1px;
  text-align:center;
  line-height:1.3;
}
.btn-ppt .desc{
  font-size:9.5pt;
  color:#3a3a2e;
  letter-spacing:0.5px;
  text-align:center;
}

/* 장르별 활동지 카드 */
.genre-grid{
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.genre-card{
  background:rgba(255,255,255,0.06);
  border:2px solid rgba(255,255,255,0.2);
  border-radius:14px;
  padding:16px 16px 14px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.genre-name{
  font-family:'Nanum Myeongjo',serif;
  font-size:15pt;
  font-weight:800;
  color:#f0e6d3;
  letter-spacing:1px;
}
.genre-sub{
  font-size:9.5pt;
  color:#c9a96e;
  letter-spacing:0.5px;
  margin-top:-6px;
}
.small-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.btn-small{
  background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,255,255,0.25);
  border-radius:12px;
  padding:16px 8px;
  cursor:pointer;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  transition:transform 0.2s, background 0.2s;
}
.btn-small:hover{
  transform:translateY(-3px);
  background:rgba(255,255,255,0.16);
}
.btn-small .icon{font-size:20pt;}
.btn-small .label{
  font-family:'Nanum Myeongjo',serif;
  font-size:12pt;
  font-weight:700;
  color:#f0e6d3;
  letter-spacing:1px;
  text-align:center;
}
.btn-small .desc{
  font-size:8pt;
  color:#aaa;
  letter-spacing:0.3px;
  text-align:center;
}

@media (max-width:520px){
  .ppt-row{grid-template-columns:1fr;}
  .genre-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
